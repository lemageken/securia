# lib/android/gradle.properties

# Arguments JVM pour le processus Gradle.
# -Xmx4096m : Alloue 4GB de mémoire maximale au processus Gradle.
# -XX:MaxMetaspaceSize=2048m : Alloue 2GB pour les métadonnées de classes.
# -XX:ReservedCodeCacheSize=512m : Alloue 512MB pour le cache du code compilé.
# -XX:+HeapDumpOnOutOfMemoryError : Génère un dump de la mémoire en cas d'erreur OutOfMemory.
# -Dkotlin.daemon.jvm.options=-Xmx2048m : Alloue 2GB au démon Kotlin (important pour les projets Android).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2048m

# Active le support d'AndroidX pour les dépendances.
android.useAndroidX=true
# Active Jetifier pour la compatibilité avec les anciennes bibliothèques.
android.enableJetifier=true

# Désactive la compilation incrémentale Kotlin pour éviter les erreurs de chemin relatif entre disques différents (C: et D:)
kotlin.incremental=false